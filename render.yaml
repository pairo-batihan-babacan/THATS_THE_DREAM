# Free-tier preview deploy of pdfworks.io.
#
# One container holds FastAPI, a single Celery worker and a local Redis, so the
# site needs no paid add-ons: no managed Redis, no managed Postgres. The Next.js
# app under pdfworks/ is not deployed — the live frontend is the Jinja2 one that
# FastAPI serves itself.
services:
  - type: web
    name: pdfworks
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Lean process layout: Redis in-container, one worker across both queues.
      - key: DEPLOY_PROFILE
        value: free
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: REDIS_URL
        value: redis://127.0.0.1:6379/0

      # Free instances get no disk, so SQLite lives in the container and resets
      # on every deploy and every spin-down. Fine for a preview box.
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////tmp/pdfworks.db
      - key: UPLOAD_DIR
        value: /tmp/fileconvert/uploads
      - key: OUTPUT_DIR
        value: /tmp/fileconvert/outputs

      # 512 MB of RAM will not survive a 20 MB video, so cap uploads lower than
      # production until this moves back onto a real VPS.
      - key: MAX_FILE_SIZE_MB
        value: "10"
      - key: MAX_FILE_SIZE_MB_PRO
        value: "10"
      - key: FILE_TTL_MINUTES
        value: "30"

      # Comma-separated — app/main.py splits on commas, not JSON.
      - key: ALLOWED_ORIGINS
        value: https://pdfworks.io,https://www.pdfworks.io,https://pdfworks.onrender.com

      # Set these in the dashboard if and when the feature is wanted here; the
      # app starts fine with them empty.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRO_PRICE_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
